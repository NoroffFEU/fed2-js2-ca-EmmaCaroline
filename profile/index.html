<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your profile on this fictional social media platform."
    />
    <title>Profile</title>
    <script type="module" src="/src/app.js"></script>
    <script
      src="https://kit.fontawesome.com/7f993fe397.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="box-border m-0 dark:bg-gray-950">
    <header
      class="bg-green-50 shadow-lg dark:bg-black dark:border-b dark:border-gray-700"
    >
      <nav class="container mx-auto">
        <div class="flex justify-between" id="navbar">
          <a href="/" class="flex items-center py-4 px-6" aria-label="Home">
            <img
              src="/images/logo-image.jpg"
              alt="Fictional Social Media Logo"
              class="w-14 h-14 rounded md:w-24 md:h-24"
            />
          </a>
          <button id="theme-toggle" class="my-2 mx-6 text-xl">
            <i id="sun" class="fa-solid fa-sun text-gray-600"></i>
            <i id="moon" class="fa-solid fa-moon text-white"></i>
          </button>
        </div>
      </nav>
    </header>
    <main class="px-4">
      <h1 class="hidden">Profile</h1>
      <form
        name="updateProfile"
        class="form-container"
        id="toggle-profile-form"
      >
        <button id="cancel-update" class=""></button>
        <label for="avatar-url">Avatar URL</label>
        <input type="url" name="avatar-url" placeholder="Insert image URL" />
        <label for="avatar-alt">Avatar alt</label>
        <input
          type="text"
          name="avatar-alt"
          placeholder="Alt text for your image"
        />
        <label for="banner-url">Banner URL</label>
        <input type="url" name="banner-url" placeholder="Insert image URL" />
        <label for="banner-alt">Banner alt</label>
        <input
          type="text"
          name="banner-alt"
          placeholder="Alt text for your image"
        />
        <label for="bio">Bio</label>
        <textarea
          type="text"
          name="bio"
          placeholder="Write a bio about yourself"
        ></textarea>
        <button type="submit">Save Profile</button>
      </form>
      <div
        id="profile-container"
        class="bg-gray-50 shadow-md rounded-lg mb-20 mx-6 dark:bg-black"
      >
        <div class="relative w-full h-32 sm:h-44 md:h-64 mb-6">
          <img
            id="banner-image"
            class="absolute inset-0 w-full h-full object-cover"
            alt=""
            src=""
          />
        </div>
        <div class="flex flex-col justify-center items-start mx-2">
          <img
            id="avatar-image"
            class="avatar-image w-16 h-16 rounded-full"
            alt=""
            src=""
          />
          <h2 id="user-name" class="mb-6 dark:text-gray-100"></h2>
        </div>
        <button
          id="toggle-button"
          class="btn btn.primary mx-2 mb-2 dark:text-gray-100 dark:border-gray-400"
        >
          Edit Profile
        </button>
        <p id="bio" class="max-w-full mx-2 pb-4 dark:text-gray-100"></p>
      </div>
      <div
        id="own-posts-container"
        class="container mx-auto px-6 grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 mb-20"
      >
        <div class="post-data hidden" ;>
          <div
            class="relative bg-white shadow-lg rounded-lg overflow-hidden group flex flex-col min-h-[390px] dark:bg-black"
          >
            <!-- Avatar beside the author name -->
            <div class="flex items-center py-2 px-2">
              <img
                class="default-avatar w-10 h-10 rounded-full"
                src="/images/default-avatar.jpg"
                alt="Default Avatar"
              />
              <span
                class="author-name font-body text-sm font-medium ml-2 dark:text-gray-100"
                >Author Name</span
              >
            </div>
            <div class="image-container w-full h-60 overflow-hidden">
              <img
                src=""
                alt=""
                class="post-image w-full h-full object-cover"
              />
            </div>
            <div class="flex flex-col flex-grow p-4">
              <h2
                class="post-title font-heading text-lg truncate mb-4 cursor-pointer dark:text-gray-100"
              ></h2>
              <p class="post-body dark:text-gray-100 pb-6"></p>
              <p
                class="post-tags flex flex-wrap gap-2 overflow-hidden truncate max-h-[2rem] pb-6"
              ></p>
              <div
                class="heart-icon absolute bottom-2 right-4 text-black hover:text-red-500 transition-colors cursor-pointer dark:text-gray-100"
              >
                <i class="fa-regular fa-heart"></i>
              </div>
              <div
                class="commenticon absolute bottom-2 right-12 cursor-pointer dark:text-gray-100"
                id="comment-icon"
              >
                <i class="fa-regular fa-comment"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer
      class="fixed bottom-0 left-0 w-full py-4 bg-green-50 shadow-lg dark:bg-black dark:border-b dark:border-gray-700"
    >
      <nav class="container mx-auto px-20">
        <div class="flex justify-between items-center" id="navbar">
          <a
            href="/"
            class="text-gray-600 dark:text-gray-300 hover:text-gray-950 dark:hover:text-gray-100"
            aria-label="Home"
          >
            <i class="fa-solid fa-house text-lg"></i>
          </a>
          <div class="flex items-center">
            <button
              id="menu-btn"
              class="text-gray-600 dark:text-gray-300 hover:text-gray-950 dark:hover:text-gray-100"
              aria-label="Profile"
            >
              <i class="fa-solid fa-user text-lg"></i>
            </button>
          </div>
          <button
            class="logout-btn font-heading text-gray-600 dark:text-gray-300 hover:text-gray-950 dark:hover:text-gray-100"
          >
            <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
          </button>
        </div>
        <div
          class="hidden absolute bottom-[60px] left-0 right-0 z-50 w-2/4 translate-x-2/4 bg-green-50 rounded-md border-t-2 text-center py-6 transform transition-transform duration-300 ease-out"
          id="profile-menu"
        >
          <ul class="">
            <li class="">
              <a href="/profile/" class="block pb-4 border-b">Profile</a>
              <a href="/post/create/" class="block pt-4">Create post</a>
            </li>
          </ul>
        </div>
      </nav>
    </footer>
  </body>
</html>
