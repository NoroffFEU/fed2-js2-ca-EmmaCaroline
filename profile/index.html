<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your profile on this fictional social media platform."
    />
    <title>Profile</title>
    <script type="module" src="/src/app.js"></script>
    <script
      src="https://kit.fontawesome.com/7f993fe397.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <header class="bg-green-50 shadow-lg mb-16">
    <nav class="container mx-auto">
      <div class="flex justify-between" id="navbar">
        <a href="/" class="flex items-center py-4 px-6" aria-label="Home">
          <img
            src="/images/logo-image.jpg"
            alt="Fictional Social Media Logo"
            class="w-32 h-32 rounded"
          />
        </a>

        <div class="hidden md:flex items-center pr-10" id="menu-desktop">
          <a
            href="/"
            class="my-2 mx-6 font-medium text-lg text-gray-600 hover:text-gray-950"
            >Home</a
          >
          <a
            href="/profile/"
            class="my-2 mx-6 font-medium text-lg text-gray-600 underline hover:text-gray-950"
            >Profile</a
          >
          <button
            class="logout-btn py-2 mx-4 px-4 font-medium text-lg text-gray-600 border border-gray-400 rounded hover:text-gray-950"
          >
            Logout
          </button>
        </div>

        <div class="flex px-6 md:hidden items-center" id="hamburger-icon">
          <button class="" id="menu-btn">
            <i class="fa-solid fa-bars text-3xl"></i>
          </button>
        </div>
      </div>

      <div class="hidden bg-white border-t py-4 px-6" id="mobile-menu">
        <ul class="">
          <li class="py-2 font-medium text-lg text-gray-600">
            <a href="/" class="">Home</a>
          </li>
          <li class="py-2 font-medium text-lg text-gray-600 underline">
            <a href="/profile/" class="">Profile</a>
          </li>
          <li class="py-2 font-medium text-lg text-gray-600">
            <button class="logout-btn">Logout</button>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  <body class="box-border m-0">
    <main>
      <h1>Profile</h1>
      <button id="toggle-button">Update Profile</button>
      <form name="updateProfile" class="form-container">
        <label for="avatar-url">Avatar URL</label>
        <input type="url" name="avatar-url" placeholder="Insert image URL" />
        <label for="avatar-alt">Avatar alt</label>
        <input
          type="text"
          name="avatar-alt"
          placeholder="Alt text for your image"
        />
        <label for="banner-url">Banner URL</label>
        <input type="url" name="banner-url" placeholder="Insert image URL" />
        <label for="banner-alt">Banner alt</label>
        <input
          type="text"
          name="banner-alt"
          placeholder="Alt text for your image"
        />
        <label for="bio">Bio</label>
        <textarea
          type="text"
          name="bio"
          placeholder="Write a bio about yourself"
        ></textarea>
        <button type="submit">Save Profile</button>
      </form>
      <div id="profile-container">
        <div class="relative w-full h-36 sm:h-72 md:h-96 lg:h-112">
          <img
            id="banner-image"
            class="absolute inset-0 w-full h-full object-cover"
            alt="Banner Image"
            src="default-banner.jpg"
          />
        </div>
        <h2 id="user-name">Username</h2>
        <img
          id="avatar-image"
          class="avatar-image w-20 h-20 rounded-full"
          alt="Avatar Image"
          src="default-avatar.jpg"
        />
        <p id="bio">No bio available</p>
      </div>
      <div id="own-posts-container">
        <div class="post-data" style="display: none">
          <h2 class="post-title"></h2>
          <div class="image-container">
            <img src="" alt="" class="post-image" />
          </div>
          <p class="post-body"></p>
          <p class="post-author">
            Posted by: <span class="author-name"></span>
          </p>
          <p class="post-tags"></p>
          <button class="see-post-btn">See Post</button>
        </div>
      </div>
    </main>
  </body>
</html>
