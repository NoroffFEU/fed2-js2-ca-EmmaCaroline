<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/post/create/">Create post</a>
    </nav>
  </header>
  <body class="box-border m-0">
    <main>
      <h1>Profile</h1>
      <button id="toggle-button">Update Profile</button>
      <form name="updateProfile" class="form-container">
        <label for="avatar-url">Avatar URL</label>
        <input type="url" name="avatar-url" placeholder="Insert image URL" />
        <label for="avatar-alt">Avatar alt</label>
        <input
          type="text"
          name="avatar-alt"
          placeholder="Alt text for your image"
        />
        <label for="banner-url">Banner URL</label>
        <input type="url" name="banner-url" placeholder="Insert image URL" />
        <label for="banner-alt">Banner alt</label>
        <input
          type="text"
          name="banner-alt"
          placeholder="Alt text for your image"
        />
        <label for="bio">Bio</label>
        <textarea
          type="text"
          name="bio"
          placeholder="Write a bio about yourself"
        ></textarea>
        <button type="submit">Save Profile</button>
      </form>
      <div id="profile-container">
        <div class="relative w-full h-36 sm:h-72 md:h-96 lg:h-112">
          <img
            id="banner-image"
            class="absolute inset-0 w-full h-full object-cover"
            alt="Banner Image"
            src="default-banner.jpg"
          />
        </div>
        <h2 id="user-name">Username</h2>
        <img
          id="avatar-image"
          class="avatar-image w-20 h-20 rounded-full"
          alt="Avatar Image"
          src="default-avatar.jpg"
        />
        <p id="bio">No bio available</p>
      </div>
      <div id="own-posts-container">
        <div class="post-data" style="display: none">
          <h2 class="post-title"></h2>
          <div class="image-container">
            <img src="" alt="" class="post-image" />
          </div>
          <p class="post-body"></p>
          <p class="post-author">
            Posted by: <span class="author-name"></span>
          </p>
          <p class="post-tags"></p>
          <button class="see-post-btn">See Post</button>
        </div>
      </div>
    </main>
  </body>
</html>
