<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a social media post" />
    <title>Create post</title>
    <script type="module" src="/src/app.js"></script>
    <script
      src="https://kit.fontawesome.com/7f993fe397.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <header>
    <nav>
      <a href="/">Home</a>
    </nav>
  </header>
  <body>
    <main>
      <h1>Create Post</h1>
      <form name="createPost" class="form-container">
        <label for="title">Title</label>
        <input type="text" name="title" id="title" />
        <label for="body">Text</label>
        <textarea type="text" name="body" id="body"></textarea>
        <label for="media-url">Media</label>
        <input type="url" name="media-url" placeholder="Insert image url" />
        <label for="media-alt">Media alt</label>
        <input type="text" name="media-alt" placeholder="Alt text for image" />
        <label for="tags">Tags</label>
        <input type="text" name="tags" />
        <button type="submit">Create Post</button>
      </form>
    </main>
  </body>
</html>
