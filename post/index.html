<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/profile/">Profile</a>
    </nav>
  </header>
  <body class="box-border m-0">
    <main>
      <h1>Post Page</h1>
      <div id="single-post-container">
        <div id="post-data" class="post-data">
          <h2 id="post-title">Post Title</h2>
          <div id="image-container" class="image-container">
            <img
              id="post-image"
              src=""
              alt="No description provided"
              style="display: none"
            />
          </div>
          <p id="post-body">No content available</p>
          <p id="post-tags">No tags</p>
          <p id="post-username">Posted by: Author</p>
          <!-- Add a placeholder for the edit button if needed -->
          <div id="edit-button-container">Edit Post</div>
        </div>
      </div>
      <button id="delete-button-container">Delete Post</button>
    </main>
  </body>
</html>
