<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fictional Social Media Homepage</title>
    <script type="module" src="/src/app.js"></script>
    <script
      src="https://kit.fontawesome.com/7f993fe397.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="box-border m-0">
    <header class="bg-green-50 shadow-lg mb-16">
      <nav class="container mx-auto">
        <div class="flex justify-between" id="navbar">
          <a href="/" class="flex items-center py-4 px-6" aria-label="Home">
            <img
              src="/images/logo-image.jpg"
              alt="Fictional Social Media Logo"
              class="w-24 h-24 rounded md:w-32 md:h-32"
            />
          </a>

          <div class="hidden md:flex items-center pr-10" id="menu-desktop">
            <a
              href="/"
              class="font-heading my-2 mx-6 font-medium text-lg text-gray-600 underline hover:text-gray-950"
              >Home</a
            >
            <a
              href="/profile/"
              class="font-heading my-2 mx-6 font-medium text-lg text-gray-600 hover:text-gray-950"
              >Profile</a
            >
            <button
              class="logout-btn font-heading py-2 mx-4 px-4 font-medium text-lg text-gray-600 border border-gray-400 rounded hover:text-gray-950"
            >
              Logout
            </button>
          </div>

          <div class="flex px-6 md:hidden items-center" id="hamburger-icon">
            <button class="" id="menu-btn">
              <i class="fa-solid fa-bars text-3xl"></i>
            </button>
          </div>
        </div>

        <div class="hidden bg-white border-t py-4 px-6" id="mobile-menu">
          <ul class="">
            <li
              class="font-heading py-2 font-medium text-lg text-gray-600 underline"
            >
              <a href="/" class="">Home</a>
            </li>
            <li class="font-heading py-2 font-medium text-lg text-gray-600">
              <a href="/profile/" class="">Profile</a>
            </li>
            <li class="font-heading py-2 font-medium text-lg text-gray-600">
              <button class="logout-btn">Logout</button>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <h1 class="font-heading">Posts</h1>
      <div id="posts-container" class="">
        <!-- Template for each post -->
        <div class="post-data" style="display: none">
          <h2 class="post-title font-heading"></h2>
          <div class="image-container">
            <img src="" alt="" class="post-image" />
          </div>
          <p class="post-body font-body"></p>
          <p class="post-author font-body">
            Posted by: <span class="author-name font-body"></span>
          </p>
          <p class="post-tags font-body"></p>
          <button class="see-post-btn">See Post</button>
        </div>
      </div>
    </main>
  </body>
</html>
