<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="box-border m-0">
    <main>
      <img src="/images/noroff-logo.png" alt="Noroff Logo" />
      <h1>Home</h1>
      <a href="/profile/">My Profile</a>
      <button id="logout-btn">Logout</button>
      <div id="posts-container">
        <!-- Template for each post -->
        <div class="post-data" style="display: none">
          <h2 class="post-title"></h2>
          <div class="image-container">
            <img src="" alt="" class="post-image" />
          </div>
          <p class="post-body"></p>
          <p class="post-author">
            Posted by: <span class="author-name"></span>
          </p>
          <p class="post-tags"></p>
          <button class="see-post-btn">See Post</button>
        </div>
      </div>
    </main>
  </body>
</html>
